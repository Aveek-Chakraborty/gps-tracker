<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Main Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 40px;
      color: #333;
    }

    .device-button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .device-button:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }

    .device-button:active {
      background-color: #004a9f;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <h1>Welcome to the Device Info App</h1>

  <button class="device-button" onclick="location.href='index.html'">Device Info</button>

</body>
</html>
